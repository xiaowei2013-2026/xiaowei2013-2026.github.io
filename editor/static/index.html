<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base id="article-base" href="/"><title>威的成长记录 · 文章编辑</title><link rel="stylesheet" href="/vendor/toastui-editor.min.css"><link rel="stylesheet" href="/styles.css"><script src="/vendor/toastui-editor-all.min.js" defer></script><script src="/vendor/zh-cn.js" defer></script><script src="/app.js" defer></script></head>
<body>
  <header><button id="home" type="button" class="brand">威的成长记录</button><span>本地体验 · 保存为 Markdown</span><button id="account" type="button">管理员登录</button></header>
  <dialog id="login-dialog" aria-labelledby="login-title"><form id="login-form"><h2 id="login-title">管理员登录</h2><label for="password">管理员密码</label><input id="password" type="password" autocomplete="current-password" maxlength="256" required><p id="login-status" role="status" aria-live="polite"></p><div><button id="login-cancel" type="button">取消</button><button id="login-submit" class="primary" type="submit">登录</button></div></form></dialog>
  <main>
    <section id="library">
      <div class="intro"><h1>留下日常，让成长看得见。</h1><p>打开文章阅读，点击“编辑”，直接修改页面中的正文。</p></div>
      <nav id="categories" aria-label="内容分类"></nav>
      <div class="browse"><label for="search">搜索文章</label><input id="search" type="search" placeholder="输入标题"><span id="count" role="status" aria-live="polite"></span></div>
      <div id="articles"></div>
    </section>
    <section id="article" hidden>
      <div class="article-actions"><button id="back" type="button">← 返回文章</button><div><button id="sync" type="button" disabled hidden>同步到 GitHub</button><button id="edit" type="button" disabled hidden>编辑这篇文章</button><button id="cancel" type="button" hidden>取消编辑</button><button id="save" type="button" class="primary" hidden>保存到本地</button></div></div>
      <article class="paper"><p id="meta"></p><h1 id="title"></h1><label id="title-field" hidden>文章标题<input id="title-input" maxlength="200"></label><p id="status" role="status" aria-live="polite"></p><div id="viewer"></div><div id="editor" hidden></div></article>
      <p class="local-note">保存会更新同一份 .md 文件。点击“同步到 GitHub”会提交并推送这篇文章及其上传图片，网站将在 GitHub 构建成功后更新；图表组件页稍后单独支持。</p>
    </section>
  </main>
</body>
</html>
