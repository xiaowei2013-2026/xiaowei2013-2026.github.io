<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <meta name="theme-color" content="#162236">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ "index.xml" | relURL }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ "" | relURL }}" aria-label="返回首页">
      <span class="brand-mark" aria-hidden="true">日</span>
      <span>{{ site.Title }}</span>
    </a>
    <nav aria-label="主导航">
      <a href="{{ "" | relURL }}">首页</a>
      <a href="{{ "diary/" | relURL }}">归档</a>
      <a href="{{ "tags/" | relURL }}">标签</a>
      <a href="{{ "about/" | relURL }}">关于</a>
    </nav>
  </header>
  <main>{{ block "main" . }}{{ end }}</main>
  <footer class="site-footer">
    <span>© {{ now.Year }} {{ site.Params.author }}</span>
    <a href="{{ "index.xml" | relURL }}">RSS</a>
  </footer>
</body>
</html>
