{{ define "main" }}
  <section class="page-head">
    <p class="eyebrow">浏览记录</p>
    <h1>{{ .Title }}</h1>
  </section>
  <section class="archive-list">
    {{ range .Pages.GroupByDate "2006" }}
      <div class="year-group">
        <h2>{{ .Key }}</h2>
        <div>
          {{ range .Pages }}
            <article>
              <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "01 月 02 日" }}</time>
              <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            </article>
          {{ end }}
        </div>
      </div>
    {{ end }}
  </section>
{{ end }}
