{{ define "main" }}
  <article class="article">
    <header>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006 年 01 月 02 日" }}</time>
      <h1>{{ .Title }}</h1>
      {{ with .Params.tags }}
        <div class="tags">
          {{ range . }}<a href="{{ (printf "tags/%s/" (. | urlize)) | relURL }}">#{{ . }}</a>{{ end }}
        </div>
      {{ end }}
    </header>
    <div class="prose">{{ .Content }}</div>
  </article>
{{ end }}
